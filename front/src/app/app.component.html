<header class="app-header">
  <div class="container">
    <h1 routerLink="/concerts">{{ title }}</h1>
    <div class="btn-container">
    <nav>
      <a routerLink="/concerts" routerLinkActive="active">Home</a>
    </nav>
    <nav>
      <a routerLink="/login" routerLinkActive="active">Login</a>
    </nav>
    @if (authService.isLoggedIn()) {
      <div class="flex items-center gap-3 text-sm">
        <span class="opacity-80">{{ authService.currentUser()?.email }}</span>
        <button (click)="authService.logout()"
                class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg transition-colors font-medium cursor-pointer">
          Déconnexion
        </button>
      </div>
    }
    </div>
  </div>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <div class="container">
    <p>© 2026 Concert-ticketing Shop Demo - Author: QuocTuan & Kelly</p>
    <p>Frontend (Angular) + Backend (Java) + Shared Libraries</p>
  </div>
</footer>
